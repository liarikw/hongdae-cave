<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hongdae Cave">
<meta name="theme-color" content="#1a1420">
<title>Hongdae Cave</title>
<style>
:root{
  --text:#fff;--mute:rgba(255,255,255,.68);--faint:rgba(255,255,255,.45);
  --glass:rgba(255,255,255,.13);--glass2:rgba(255,255,255,.22);--stroke:rgba(255,255,255,.24);
  --arik:#64c8ff;--shiho:#ff86c0;--both:#ffd56b;--ok:#5ee39a;--danger:#ff5a5f;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);background:#1a1420;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Rounded","Apple SD Gothic Neo","Helvetica Neue",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;font-size:20px}
button,input,select{font:inherit;color:inherit}
i{font-style:normal}

/* wallpaper: pre-blurred so tiles can be cheap translucent fills */
#wall{position:fixed;inset:-60px;z-index:-2;background:
  radial-gradient(60% 80% at 15% 20%,#7a3cff 0,transparent 60%),
  radial-gradient(55% 70% at 85% 30%,#ff5e8a 0,transparent 60%),
  radial-gradient(60% 70% at 60% 95%,#ff9f43 0,transparent 60%),
  linear-gradient(135deg,#2a1840,#1a1420);
  background-size:cover;background-position:center;filter:blur(38px) saturate(1.6) brightness(.85);transition:background-image 1.5s}
#shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.05) 40%,rgba(0,0,0,.25))}

/* glass primitives */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.20),rgba(255,255,255,.07) 45%,rgba(255,255,255,.10));border:1px solid var(--stroke);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.28)}
.blur{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}

#app{display:flex;height:100dvh;gap:14px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}

/* floating glass rail */
nav{width:96px;flex:none;border-radius:34px;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px}
.tab{width:80px;padding:12px 0 9px;border:0;border-radius:24px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--mute);transition:background .25s,color .25s,transform .15s}
.tab span{font-size:32px;line-height:1}
.tab.on{background:rgba(255,255,255,.26);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tab:active,.press:active{transform:scale(.94)}
.sp{flex:1}
.who{width:64px;height:64px;border-radius:50%;border:3px solid var(--arik);background:rgba(255,255,255,.16);font-weight:800;font-size:24px;box-shadow:0 0 0 4px rgba(100,200,255,.18)}
.who.shiho{border-color:var(--shiho);box-shadow:0 0 0 4px rgba(255,134,192,.2)}

main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

/* header */
.top{flex:none;display:flex;align-items:center;gap:14px;min-height:68px}
.ttl h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.05;white-space:nowrap}
.ttl .sub{font-size:16px;color:var(--mute);font-weight:600;white-space:nowrap}
#roastPill{flex:1;min-width:0;border-radius:24px;padding:8px 18px;font-size:17px;line-height:1.2;min-height:62px;font-weight:700;display:flex;align-items:center;gap:10px}
#roastPill b{font-size:22px}
#roast{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:opacity .5s}
.clock{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;white-space:nowrap;line-height:1}
.circ{width:52px;height:52px;flex:none;border-radius:50%;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}

section{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:2px 2px 16px;border-radius:var(--r)}
section.on{display:block}
section::-webkit-scrollbar{display:none}

/* inputs & buttons */
.bar{display:flex;gap:10px;align-items:center;border-radius:999px;padding:8px;margin-bottom:12px}
.bar input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:10px 14px;font-size:21px;-webkit-user-select:text;user-select:text}
.bar input::placeholder{color:var(--faint)}
select,.cap,input[type=number]{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:12px 20px;font-size:19px;font-weight:600;outline:0}
input[type=number]{width:100px;text-align:center;-webkit-user-select:text;user-select:text}
.cap{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.prim{background:#fff;color:#1a1420;border-color:#fff;font-weight:800}
.plus{width:54px;height:54px;border-radius:50%;border:0;background:#fff;color:#1a1420;font-size:32px;font-weight:600;line-height:1;flex:none}
.danger{background:var(--danger);border-color:var(--danger);color:#fff}

.pills{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:8px}
.pill .n{font-variant-numeric:tabular-nums;color:#fff}
.pill.on{background:#fff;color:#1a1420;border-color:#fff}
.pill.on .n{color:#1a1420}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* Home-style tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{position:relative;border-radius:var(--r);padding:16px 16px 14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .15s,opacity .3s,background .3s}
.tile:active{transform:scale(.96)}
.ico{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px}
.tile .t{font-size:21px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .m{font-size:15px;color:var(--mute);font-weight:600;display:flex;gap:8px;align-items:center;margin-top:3px}
.tile .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:var(--mute);font-size:22px;line-height:1}
.tile.done{opacity:.5}
.tile.done .ico{background:var(--ok);font-size:26px}
.tile.done .t{text-decoration:line-through;text-decoration-thickness:2px}
.tag{border-radius:999px;padding:2px 10px;font-weight:800;color:#1a1420;font-size:13px}
.tag.arik{background:var(--arik)}.tag.shiho{background:var(--shiho)}.tag.both{background:var(--both)}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:44px 10px;font-size:21px;font-weight:600;border-radius:var(--r)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:22px;object-fit:cover;width:100%;background:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.2)}

.pre{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.pre::-webkit-scrollbar{display:none}
.pre .cap{padding:14px 20px;font-size:20px;flex:none}
.timer{border-radius:var(--r);padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.timer .big{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;min-width:200px;line-height:1}
.timer .lbl{flex:1;font-size:24px;font-weight:700}
.timer .prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--both),#ff8a5b);border-radius:0 4px 4px 0;transition:width 1s linear}

/* overlays */
.overlay{position:fixed;inset:0;display:none;z-index:50}
.overlay.on{display:flex}
#alarm{align-items:center;justify-content:center;background:rgba(120,10,20,.55);animation:fl 1.1s infinite}
#alarm .card{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding:30px 50px}
#alarm h1{font-size:64px;margin:0;letter-spacing:-1px}
#alarm p{font-size:30px;margin:0;font-weight:700}
@keyframes fl{50%{background:rgba(200,20,30,.75)}}
#show{background:#000;align-items:center;justify-content:center}
#show img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .8s;opacity:0}
#show .info{position:absolute;left:24px;bottom:18px;right:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;pointer-events:none}
#show .sc{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#show .sr{border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;max-width:55%}
#lb{background:rgba(0,0,0,.9);align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .bar2{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;display:flex;gap:10px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;width:64px;height:64px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.14);color:#fff}
#sheet{background:rgba(0,0,0,.35);align-items:center;justify-content:center}
.card{border-radius:34px;padding:20px;width:min(680px,94vw);max-height:92dvh;overflow:auto}
.card .bar{background:rgba(255,255,255,.1)}
.rl{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px}
.rl span{flex:1}
.rl .x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--mute);font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 24px;border-radius:999px;font-weight:700;font-size:18px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

@media (orientation:portrait){
 #app{flex-direction:column-reverse;padding-left:12px;padding-right:12px}
 nav{width:auto;flex-direction:row;justify-content:space-around;padding:6px 10px;border-radius:999px}
 .tab{width:76px;padding:8px 0 6px}.tab span{font-size:26px}
 .sp{display:none}.who{width:54px;height:54px;font-size:20px}
 .top{flex-wrap:wrap}.clock{font-size:34px}
 #roastPill{order:5;flex-basis:100%}
 .tiles{grid-template-columns:1fr 1fr}
 .timer .big{font-size:44px;min-width:130px}
}
@media (prefers-reduced-transparency:reduce){.glass{background:rgba(40,30,50,.92)}}
</style>
</head>
<body>
<div id="wall"></div><div id="shade"></div>
<div id="app">
  <nav class="glass blur">
    <button class="tab on" data-tab="chores"><span>✅</span><i data-i18n="chores">Chores</i></button>
    <button class="tab" data-tab="photos"><span>🖼️</span><i data-i18n="photos">Photos</i></button>
    <button class="tab" data-tab="timers"><span>⏱️</span><i data-i18n="timers">Timers</i></button>

  <main>

        <input type="text" id="cTitle" data-ph="newChore" maxlength="80" enterkeyhint="done">
        <select id="cOwner"><option value="both" data-i18n="both">Both</option><option value="arik" data-i18n="arik">Arik</option><option value="shiho" data-i18n="shiho">Shi Ho</option></select>
        <select id="cRepeat"><option value="none" data-i18n="oneoff">One-off</option><option value="daily" data-i18n="daily">Daily</option><option value="weekly" data-i18n="weekly">Weekly</option></select>
        <button class="plus press" id="cAdd">+</button>
      </div>

        <input id="upl" type="file" accept="image/*" multiple hidden>
        <button class="cap glass blur press" id="showBtn" data-i18n="slideshow">▶ Slideshow</button>
        <span class="pill glass blur" id="pCount" style="display:none"></span>
      </div>
      <div class="photos" id="pGrid"></div>
    </section>

    <section id="s-timers">
      <div class="bar glass blur">
        <input type="text" id="tLabel" data-ph="timerLabel" maxlength="40">
        <input type="number" id="tMin" data-ph="min" inputmode="numeric" min="1" max="999">
        <button class="cap prim press" id="tStart" data-i18n="start">Start</button>
      </div>
      <div class="pre" id="tPre"></div>
      <div id="tList"></div>
    </section>
  </main>
</div>

<div id="alarm" class="overlay"><div class="card glass blur"><h1 data-i18n="timesUp">⏰ TIME'S UP</h1><p id="alarmLbl"></p><button class="cap prim press" id="alarmOk" data-i18n="dismiss" style="font-size:26px;padding:16px 48px">Dismiss</button></div></div>
<div id="show" class="overlay"><img id="showImg" alt=""><div class="info"><div class="sc" id="showClock"></div><div class="sr glass blur" id="showRoast"></div></div></div>
<div id="lb" class="overlay"><img id="lbImg" alt=""><button class="nav" id="lbPrev" style="left:16px">‹</button><button class="nav" id="lbNext" style="right:16px">›</button><div class="bar2"><button class="cap danger press" id="lbDel" data-i18n="del">Delete</button><button class="cap glass blur press" id="lbClose" data-i18n="close">Close</button></div></div>
<div id="sheet" class="overlay"><div class="card glass blur">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:26px" data-i18n="roastTitle">Roast messages</b><button class="cap prim press" id="sheetClose" data-i18n="done">Done</button></div>
  <div class="bar"><input type="text" id="rText" data-ph="roastPh" maxlength="140"></div>

  <div id="rList"></div>
</div></div>
<div id="toast" class="glass blur"></div>

    roasts:()=>sb.from('roasts').select('*').order('created_at')
  };
  const {data,error}=await q[tb]();
  if(error){toast(t('loadErr')+error.message);return}
  S[tb]=data;
  if(tb==='chores')await resetRepeats();
  if(tb==='photos'&&!wallSet)setWall();
  render(tb);
}
async function resetRepeats(){
  const now=new Date(),day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const wk=new Date(day);wk.setDate(day.getDate()-((day.getDay()+6)%7));
  const stale=S.chores.filter(c=>c.done&&c.repeat!=='none'&&c.done_at&&new Date(c.done_at)<(c.repeat==='daily'?day:wk));
  if(!stale.length)return;
  await sb.from('chores').update({done:false,done_at:null}).in('id',stale.map(c=>c.id));
  stale.forEach(c=>{c.done=false;c.done_at=null});
}
function subscribe(){
  const ch=sb.channel('cave');
  ['chores','timers','photos','roasts'].forEach(tb=>ch.on('postgres_changes',{event:'*',schema:'public',table:tb},()=>load(tb)));
  ch.subscribe();
}

/* wallpaper from a random shared photo, like Home's blurred wallpaper */
let wallSet=false;
function setWall(){
  if(!S.photos.length)return;
  const p=S.photos[Math.floor(Math.random()*S.photos.length)];
  const img=new Image();img.onload=()=>{$('#wall').style.backgroundImage=`url("${img.src}")`;wallSet=true};img.src=photoUrl(p);
}

/* ---------- render ---------- */
function render(tb){
  if(tb==='chores')renderChores();
  if(tb==='photos')renderPhotos();
  if(tb==='timers')renderTimers();
  if(tb==='roasts')renderRoasts();
}
function renderChores(){
  const f=S.filter,open=S.chores.filter(c=>!c.done);
  const cnt={all:open.length,arik:open.filter(c=>c.owner!=='shiho').length,shiho:open.filter(c=>c.owner!=='arik').length};
  const dot={all:'',arik:'<i class="dot" style="background:var(--arik)"></i>',shiho:'<i class="dot" style="background:var(--shiho)"></i>'};
  $('#cFilter').innerHTML=['all','arik','shiho'].map(k=>`<button class="pill glass blur press ${f===k?'on':''}" data-f="${k}">${dot[k]}${t(k)} <span class="n">${cnt[k]}</span></button>`).join('');
  let list=S.chores.filter(c=>f==='all'||c.owner===f||c.owner==='both');
  list.sort((a,b)=>(a.done-b.done)||(new Date(a.created_at)-new Date(b.created_at)));
  $('#cList').innerHTML=list.length?list.map(c=>`<div class="tile glass ${c.done?'done':''}" data-id="${c.id}" data-act="toggle">
    <div class="ico">${c.done?'✓':iconFor(c.title)}</div>
    <div><div class="t">${esc(c.title)}</div><div class="m"><span class="tag ${c.owner}">${t(c.owner)}</span>${c.repeat!=='none'?`<span>🔁 ${t(c.repeat)}</span>`:''}<span>${c.done?t('doneLbl'):''}</span></div></div>
    <button class="x" data-act="del">×</button></div>`).join(''):`<div class="empty glass">${t('emptyChores')}</div>`;
}
function renderPhotos(){
  const pc=$('#pCount');pc.style.display=S.photos.length?'':'none';pc.innerHTML=`🖼️ <span class="n">${t('nPhotos',S.photos.length)}</span>`;
  $('#pGrid').innerHTML=S.photos.length?S.photos.map((p,i)=>`<img class="ph" loading="lazy" data-i="${i}" src="${photoUrl(p)}" alt="">`).join(''):`<div class="empty glass">${t('emptyPhotos')}</div>`;
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')}
const pct=x=>{const a=new Date(x.created_at),b=new Date(x.ends_at);return Math.min(100,Math.max(0,(Date.now()-a)/(b-a)*100))};
function renderTimers(){
  $('#tList').innerHTML=S.timers.length?S.timers.map(x=>`<div class="timer glass" data-id="${x.id}"><div class="big" data-end="${x.ends_at}">${fmt(new Date(x.ends_at)-Date.now())}</div><div class="lbl">${esc(x.label)}<div class="m" style="font-size:15px;margin-top:6px"><span class="tag ${x.created_by}">${t(x.created_by)||''}</span></div></div><button class="cap press" data-act="cancel">${t('cancel')}</button><div class="prog" data-start="${x.created_at}" data-endp="${x.ends_at}" style="width:${pct(x)}%"></div></div>`).join(''):`<div class="empty glass">${t('emptyTimers')}</div>`;
}
function renderRoasts(){
  $('#rList').innerHTML=S.roasts.map(r=>`<div class="rl" data-id="${r.id}"><span>${esc(rtext(r))}</span><span class="tag ${r.target}" style="flex:none">${t(r.target)}</span><button class="x" data-act="rdel">×</button></div>`).join('')||`<div class="empty">${t('emptyRoasts')}</div>`;
}

/* ---------- roasts ---------- */
function pickRoast(){
  const pool=S.roasts.filter(r=>r.target==='both'||r.target===S.user);
  if(!pool.length)return'';
  let r;for(let i=0;i<5;i++){r=pool[Math.floor(Math.random()*pool.length)];if(rtext(r)!==lastRoast)break}
  lastRoast=rtext(r);return lastRoast;
}
function rotateRoast(){
  const el=$('#roast');el.style.opacity=0;
  setTimeout(()=>{const x=pickRoast();el.textContent=x;$('#showRoast').textContent='🗯️ '+x;el.style.opacity=1},500);
}

/* ---------- tabs / user / lang ---------- */
function setTab(tb){
  S.tab=tb;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tb));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+tb));
}
function setUser(u,quiet){
  S.user=u;localStorage.setItem('cave_user',u);
  const w=$('#who');w.textContent=u==='arik'?t('initA'):t('initS');w.classList.toggle('shiho',u==='shiho');
  if(!quiet)toast(t('viewing',t(u)));
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#who').onclick=()=>{setUser(S.user==='arik'?'shiho':'arik');rotateRoast();tick()};
$('#lang').onclick=()=>{S.lang=S.lang==='en'?'ko':'en';localStorage.setItem('cave_lang',S.lang);applyLang();rotateRoast();tick()};
setUser(S.user,true);applyLang();

/* ---------- chores ---------- */
async function addChore(){
  const title=$('#cTitle').value.trim();if(!title)return;
  const {error}=await sb.from('chores').insert({title,owner:$('#cOwner').value,repeat:$('#cRepeat').value});
  if(error)return toast(error.message);
  $('#cTitle').value='';$('#cTitle').blur();load('chores');
}
$('#cAdd').onclick=addChore;
$('#cTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addChore()});
$('#cFilter').onclick=e=>{const b=e.target.closest('[data-f]');if(b){S.filter=b.dataset.f;renderChores()}};
$('#cList').onclick=async e=>{
  const el=e.target.closest('[data-act]'),row=e.target.closest('.tile');if(!el||!row)return;
  const c=S.chores.find(x=>x.id===row.dataset.id);if(!c)return;
  if(el.dataset.act==='del'){
    S.chores=S.chores.filter(x=>x.id!==c.id);renderChores();
    await sb.from('chores').delete().eq('id',c.id);return;
  }
  c.done=!c.done;c.done_at=c.done?new Date().toISOString():null;renderChores();
  await sb.from('chores').update({done:c.done,done_at:c.done_at}).eq('id',c.id);
};

/* ---------- photos ---------- */
function compress(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1800,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(url);res(b||file)},'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
$('#upl').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';let ok=0;
  for(let i=0;i<files.length;i++){
    toast(t('uploading',i+1,files.length));
    const blob=await compress(files[i]);
    const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error){toast(t('upFail')+up.error.message);continue}
    const ins=await sb.from('photos').insert({path,uploaded_by:S.user});
    if(ins.error){toast(ins.error.message);continue}
    ok++;
  }
  if(ok)toast(t('added',ok));
  load('photos');
};
$('#pGrid').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined)openLb(+i)};
function openLb(i){lbIdx=i;$('#lbImg').src=photoUrl(S.photos[i]);$('#lb').classList.add('on')}
function lbStep(d){if(!S.photos.length)return;openLb((lbIdx+d+S.photos.length)%S.photos.length)}
$('#lbPrev').onclick=()=>lbStep(-1);$('#lbNext').onclick=()=>lbStep(1);
$('#lbClose').onclick=()=>$('#lb').classList.remove('on');
$('#lbDel').onclick=async()=>{
  const p=S.photos[lbIdx];if(!p||!confirm(t('confirmDel')))return;
  await sb.storage.from('photos').remove([p.path]);await sb.from('photos').delete().eq('id',p.id);
  $('#lb').classList.remove('on');load('photos');
};

/* slideshow */
function showNext(){
  if(!S.photos.length)return stopShow();
  const img=$('#showImg');img.style.opacity=0;
  setTimeout(()=>{
    if(showIdx>=showOrder.length){showOrder=S.photos.map((_,i)=>i).sort(()=>Math.random()-.5);showIdx=0}
    const p=S.photos[showOrder[showIdx++]];if(!p)return;
    img.onload=()=>img.style.opacity=1;img.src=photoUrl(p);
  },800);
}
function startShow(){
  if(!S.photos.length)return toast(t('addFirst'));
  showOn=true;showIdx=0;showOrder=[];$('#show').classList.add('on');showNext();
  $('#showRoast').textContent='🗯️ '+$('#roast').textContent;
  showTimer=setInterval(showNext,9000);
}
function stopShow(){showOn=false;clearInterval(showTimer);$('#show').classList.remove('on');last=Date.now()}
$('#showBtn').onclick=startShow;$('#show').onclick=stopShow;

/* ---------- timers + alarm ---------- */
async function startTimer(min,label){
  min=+min;if(!min||min<1)return toast(t('enterMin'));
  const {error}=await sb.from('timers').insert({label:(label||'').trim()||t('timer'),ends_at:new Date(Date.now()+min*60000).toISOString(),created_by:S.user});
  if(error)return toast(error.message);
  $('#tMin').value='';$('#tLabel').value='';load('timers');
}
$('#tPre').onclick=e=>{const b=e.target.closest('[data-m]');if(b)startTimer(b.dataset.m,$('#tLabel').value)};
$('#tStart').onclick=()=>startTimer($('#tMin').value,$('#tLabel').value);
$('#tList').onclick=async e=>{
  if(e.target.dataset.act!=='cancel')return;
  const id=e.target.closest('.timer').dataset.id;
  S.timers=S.timers.filter(x=>x.id!==id);renderTimers();
  await sb.from('timers').update({dismissed:true}).eq('id',id);
};
let ac,alarmBeep=null,alarmId=null;
function unlockAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
document.addEventListener('pointerdown',unlockAudio);
function beep(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.28)}
function checkAlarm(){
  const due=S.timers.find(x=>new Date(x.ends_at)<=Date.now());
  if(due&&alarmId!==due.id){
    alarmId=due.id;$('#alarmLbl').textContent=due.label;$('#alarm').classList.add('on');
    if(showOn)stopShow();beep();clearInterval(alarmBeep);alarmBeep=setInterval(beep,900);
  }
  if(!due&&alarmId){alarmId=null;$('#alarm').classList.remove('on');clearInterval(alarmBeep)}
}
$('#alarmOk').onclick=async()=>{
  const id=alarmId;alarmId=null;$('#alarm').classList.remove('on');clearInterval(alarmBeep);
  S.timers=S.timers.filter(x=>x.id!==id);renderTimers();
  if(id)await sb.from('timers').update({dismissed:true}).eq('id',id);
};

/* ---------- roast editor ---------- */
$('#gear').onclick=()=>{renderRoasts();$('#sheet').classList.add('on')};
$('#sheetClose').onclick=()=>$('#sheet').classList.remove('on');
$('#rAdd').onclick=async()=>{
  const text=$('#rText').value.trim(),ko=$('#rTextKo').value.trim();
  if(!text&&!ko)return;
  const {error}=await sb.from('roasts').insert({text:text||ko,text_ko:ko||null,target:$('#rTarget').value});
  if(error)return toast(error.message);
  $('#rText').value='';$('#rTextKo').value='';load('roasts');
};
$('#rList').onclick=async e=>{
  if(e.target.dataset.act!=='rdel')return;
  const id=e.target.closest('.rl').dataset.id;
  S.roasts=S.roasts.filter(r=>r.id!==id);renderRoasts();
  await sb.from('roasts').delete().eq('id',id);
};

/* ---------- clock, idle, wake lock ---------- */
function tick(){
  const d=new Date(),loc=t('locale');
  const time=d.toLocaleTimeString(loc,{hour:'numeric',minute:'2-digit'});
  $('#clock').textContent=time;$('#showClock').textContent=time;
  $('#date').textContent=d.toLocaleDateString(loc,{weekday:'long',month:'short',day:'numeric'});
  document.querySelectorAll('.big[data-end]').forEach(el=>el.textContent=fmt(new Date(el.dataset.end)-Date.now()));
  document.querySelectorAll('.prog').forEach(el=>el.style.width=pct({created_at:el.dataset.start,ends_at:el.dataset.endp})+'%');
  checkAlarm();
  if(!showOn&&!alarmId&&S.photos.length&&Date.now()-last>120000&&!$('#lb').classList.contains('on')&&!$('#sheet').classList.contains('on')&&document.activeElement.tagName!=='INPUT')startShow();
}
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{last=Date.now()},true));
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();['chores','timers','photos','roasts'].forEach(load)}});
document.addEventListener('pointerdown',wake,{once:true});

/* ---------- boot ---------- */
(async()=>{
  await Promise.all(['chores','timers','photos','roasts'].map(load));
  rotateRoast();setInterval(rotateRoast,25000);
  setInterval(tick,1000);tick();wake();subscribe();
  setInterval(()=>['chores','timers','photos'].forEach(load),120000);
  setInterval(setWall,600000);
})();
</script>
</body>
