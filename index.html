<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hongdae Cave">
<meta name="theme-color" content="#1a1420">
<title>Hongdae Cave</title>
<style>
:root{
  --text:#fff;--mute:rgba(255,255,255,.7);--faint:rgba(255,255,255,.45);
  --stroke:rgba(255,255,255,.24);
  --arik:#64c8ff;--shiho:#ff86c0;--both:#ffd56b;--ok:#5ee39a;--danger:#ff5a5f;--warn:#ffb340;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);background:#1a1420;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Rounded","Apple SD Gothic Neo","Helvetica Neue",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
i{font-style:normal}
.hj{font-size:.6em;font-weight:600;opacity:.72;margin-left:1px;letter-spacing:0;white-space:nowrap}
.nr .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button,.cap,.pill{white-space:nowrap}

#wall{position:fixed;inset:-60px;z-index:-2;background:
  radial-gradient(60% 80% at 15% 20%,#7a3cff 0,transparent 60%),
  radial-gradient(55% 70% at 85% 30%,#ff5e8a 0,transparent 60%),
  radial-gradient(60% 70% at 60% 95%,#ff9f43 0,transparent 60%),
  linear-gradient(135deg,#2a1840,#1a1420);
  background-size:cover;background-position:center;filter:blur(38px) saturate(1.6) brightness(.85)}
#shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.05) 40%,rgba(0,0,0,.25))}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.20),rgba(255,255,255,.07) 45%,rgba(255,255,255,.10));border:1px solid var(--stroke);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.28)}
.blur{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.press{transition:transform .15s}
.press:active{transform:scale(.95)}

#app{display:flex;height:100dvh;gap:14px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}

/* Home-style sidebar */
aside{width:232px;flex:none;border-radius:32px;display:flex;flex-direction:column;padding:13px 10px 8px;gap:1px;overflow-y:auto}
aside::-webkit-scrollbar{display:none}
.brand{padding:0 10px 5px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand .sub{font-size:15px;color:var(--mute);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.nr{display:flex;align-items:center;gap:12px;padding:4px 10px;min-height:40px;flex:none;border-radius:15px;border:0;background:transparent;font-size:19px;font-weight:600;color:#fff;width:100%;text-align:left;transition:background .2s}
.nr .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.nr.on{background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.nr .bd{margin-left:auto;font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:700}
.nr .bd.hot{background:var(--danger);color:#fff;border-radius:999px;padding:1px 9px;min-width:26px;text-align:center}
.sp{flex:1;min-height:6px}
.me{display:flex;align-items:center;gap:6px;padding:4px 2px 0;flex:none}
.who{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px;border-radius:999px;flex:1;min-width:0;text-align:left}
.av{width:42px;height:42px;border-radius:50%;border:3px solid var(--arik);background:rgba(255,255,255,.16);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.av.shiho{border-color:var(--shiho)}
.who .nm{font-size:17px;font-weight:700;line-height:1.1}
.who .sw{font-size:12px;color:var(--mute);font-weight:600}
.circ{width:40px;height:40px;flex:none;border-radius:50%;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}

main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

/* big centered message */
#roastBar{flex:none;border-radius:28px;min-height:76px;padding:10px 28px;display:flex;align-items:center;justify-content:center;text-align:center}
#roast{font-size:27px;font-weight:800;letter-spacing:-.3px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:opacity .5s}

section{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:2px 2px 16px}
section.on{display:block}
section::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hd h2{margin:0 6px 0 4px;font-size:32px;font-weight:800;letter-spacing:-.6px}
.hd .sp{flex:1}

.cap{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;padding:11px 20px;font-size:19px;font-weight:700;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16)}
.prim{background:#fff;color:#1a1420;border-color:#fff;font-weight:800}
.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.plus{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#1a1420;font-size:32px;font-weight:600;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.pill{border-radius:999px;padding:9px 18px;font-size:18px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:8px}
.pill .n{font-variant-numeric:tabular-nums;color:#fff}
.pill.on{background:#fff;color:#1a1420;border-color:#fff}
.pill.on .n{color:#1a1420}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

/* widgets */
.wg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:146px;gap:12px}
.w{border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.w .wl{font-size:15px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.w .big{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;margin-top:auto}
.w .s{font-size:16px;color:var(--mute);font-weight:600;margin-top:4px}
.w-clock{grid-column:span 2;grid-row:span 2;justify-content:space-between;padding:22px 24px}
.w-clock .tm{white-space:nowrap;font-size:96px;font-weight:800;letter-spacing:-3px;line-height:.95;font-variant-numeric:tabular-nums}
.w-clock .ap{font-size:30px;font-weight:700;letter-spacing:0;margin-left:6px;color:var(--mute)}
.w-clock .dt{font-size:24px;font-weight:700}
.w-clock .yr{font-size:17px;color:var(--mute);font-weight:600;margin-top:2px}
.w-photo{grid-column:span 2;padding:0;background-size:cover;background-position:center}
.w-photo .ov{margin-top:auto;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.5));font-size:16px;font-weight:700}
.w-wide{grid-column:span 2}
.wl2{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.wl2 li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;min-width:0}
.wl2 li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-txt{font-size:20px;font-weight:700;line-height:1.2;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* chore tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;border-radius:var(--r);padding:14px 14px 13px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .15s,opacity .3s}
.tile:active{transform:scale(.96)}
.ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:27px;flex:none}
.tile .t{font-size:20px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:15px;color:var(--mute);font-weight:600;display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:var(--mute);font-size:22px;line-height:1;padding:0}
.done{opacity:.5}
.tile.done .ico{background:var(--ok)}
.done .t{text-decoration:line-through;text-decoration-thickness:2px}
.tag{border-radius:999px;padding:2px 10px;font-weight:800;color:#1a1420;font-size:13px}
.tag.arik{background:var(--arik)}.tag.shiho{background:var(--shiho)}.tag.both{background:var(--both)}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:40px 10px;font-size:21px;font-weight:600;border-radius:var(--r)}

/* task rows */
.grp{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);margin:14px 6px 8px}
.grp:first-child{margin-top:0}
.trow{position:relative;display:flex;align-items:center;gap:14px;border-radius:22px;padding:12px 60px 12px 14px;margin-bottom:8px}
.chk{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:transparent;flex:none;font-size:22px;color:transparent;padding:0}
.trow.done .chk{background:var(--ok);border-color:var(--ok);color:#0b2e18}
.trow .t{font-size:21px;font-weight:700;line-height:1.2}
.trow .x{top:50%;transform:translateY(-50%)}
.due{font-weight:800}
.due.over{color:var(--danger)}.due.today{color:var(--warn)}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.note{position:relative;border-radius:var(--r);padding:16px 18px;min-height:130px;display:flex;flex-direction:column;gap:8px}
.note .meta{font-size:15px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px;padding-right:40px}
.note .body{font-size:22px;font-weight:700;line-height:1.25;white-space:pre-wrap;word-break:break-word}
.note.unread{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 0 0 2px rgba(255,255,255,.75),0 12px 34px rgba(0,0,0,.28)}
.newb{background:var(--danger);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:22px;object-fit:cover;width:100%;background:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.2)}

.pre{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pre::-webkit-scrollbar{display:none}
.pre .cap{padding:14px 20px;font-size:20px;flex:none}
.timer{border-radius:var(--r);padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.timer .bigt{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;min-width:180px;line-height:1}
.timer .lbl{flex:1;font-size:23px;font-weight:700;min-width:0}
.prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--both),#ff8a5b);border-radius:0 4px 4px 0;transition:width 1s linear}

/* overlays & sheets */
.overlay{position:fixed;inset:0;display:none;z-index:50}
.overlay.on{display:flex}
.sheetbg{background:rgba(0,0,0,.35);align-items:flex-start;justify-content:center;padding-top:calc(10px + env(safe-area-inset-top))}
.card{border-radius:32px;padding:20px 22px;width:min(640px,94vw);max-height:calc(100dvh - 20px);overflow:auto}
.card h3{margin:0 0 12px;font-size:26px;font-weight:800}
.fld{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:13px 18px;font-size:21px;outline:0;margin-bottom:12px;-webkit-user-select:text;user-select:text;resize:none}
.fld::placeholder{color:var(--faint)}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.flbl{font-size:16px;font-weight:700;color:var(--mute);min-width:64px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-size:18px;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:#1a1420}
input[type=date].fld,input[type=number].fld{width:auto;margin:0;padding:10px 16px;font-size:19px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
#alarm{align-items:center;justify-content:center;background:rgba(120,10,20,.55);animation:fl 1.1s infinite}
#alarm .card{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding:30px 50px;width:auto}
#alarm h1{font-size:64px;margin:0;letter-spacing:-1px}
#alarm p{font-size:30px;margin:0;font-weight:700}
@keyframes fl{50%{background:rgba(200,20,30,.75)}}
#show{background:#000;align-items:center;justify-content:center}
#show img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .8s;opacity:0}
#show .info{position:absolute;left:24px;bottom:18px;right:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;pointer-events:none}
#show .sc{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#show .sr{border-radius:999px;padding:10px 20px;font-size:19px;font-weight:700;max-width:55%}
#lb{background:rgba(0,0,0,.9);align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .bar2{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;display:flex;gap:10px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;width:64px;height:64px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.14);color:#fff}
.rl{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px}
.rl span{flex:1}
.rl .x{position:static;flex:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 24px;border-radius:999px;font-weight:700;font-size:19px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

/* ---- v4 scale-up for iPhone 11 landscape (~800x383 usable) ---- */
#app{gap:12px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.hj{font-size:.8em;opacity:.88;font-weight:600;margin:0}
aside{width:224px;padding:10px 8px 8px}
.brand{padding:2px 10px 6px}
.brand .sub{font-size:19px;font-weight:800;color:#fff;margin:0}
.nr{min-height:44px;font-size:21px;padding:3px 10px;border-radius:16px}
.nr .ic{width:38px;height:38px;font-size:21px;border-radius:11px}
.nr .bd{font-size:18px}
.nr .bd.hot{padding:2px 10px;min-width:30px}
.me{gap:8px;padding:6px 2px 0}
.av{width:58px;height:58px;font-size:25px}
.who .nm{font-size:20px}
.circ{width:54px;height:54px;font-size:23px}
#roastBar{min-height:82px;padding:10px 28px}
#roast{font-size:31px}
.hd h2{font-size:38px}
.plus{width:62px;height:62px;font-size:38px}
.pill{font-size:21px;padding:11px 20px}
.cap{font-size:22px;padding:13px 24px}
.dot{width:14px;height:14px}
.wg{grid-auto-rows:141px}
.w .wl{font-size:17px}
.w .big{font-size:62px}
.w .s{font-size:18px}
.w-clock .dt{font-size:27px}
.w-clock .yr{font-size:18px}
.w-photo .ov{font-size:18px}
.wl2 li{font-size:20px}
.note-txt{font-size:23px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{min-height:150px;padding:16px}
.ico{width:62px;height:62px;font-size:32px}
.tile .t{font-size:24px}
.m{font-size:17px}
.tag{font-size:15px;padding:3px 11px}
.x{width:46px;height:46px;font-size:26px}
.grp{font-size:17px}
.trow{padding:14px 70px 14px 16px;gap:16px;border-radius:24px}
.chk{width:56px;height:56px;font-size:26px}
.trow .t{font-size:25px}
.notes{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.note .meta{font-size:17px}
.note .body{font-size:26px}
.newb{font-size:14px;padding:2px 9px}
.photos{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

.seg button{font-size:22px;padding:11px 18px}
input[type=date].fld,input[type=number].fld{font-size:22px;padding:12px 18px}
#toast{font-size:22px;padding:14px 26px}
.rl{font-size:21px}
#alarm h1{font-size:76px}#alarm p{font-size:36px}
.me{justify-content:space-between;padding:6px 4px 0}.who{flex:none;padding:0}
.hd{flex-wrap:nowrap}#cFilter{flex:1;min-width:0;overflow-x:auto}#cFilter::-webkit-scrollbar{display:none}#cFilter .pill{padding:10px 16px;flex:none}

/* ---- v5 Home-style top bar, summary pills, square clocks ---- */
.top{flex:none;display:flex;align-items:center;gap:12px;min-height:56px}
.top .sp{flex:1}
#pageTitle{margin:0 0 0 6px;font-size:38px;font-weight:800;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.capsule{display:flex;gap:2px;padding:4px;border-radius:999px;flex:none}
.cbtn{width:54px;height:54px;border-radius:50%;border:0;background:transparent;font-size:23px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
#ctxAdd{font-size:36px;font-weight:500;padding-bottom:3px}
main{gap:8px}
#roastBar{min-height:64px;padding:8px 24px}
#roast{font-size:28px}
.me{justify-content:flex-start;padding:6px 4px 0}
.who{flex:1;gap:12px;padding:0}
.who .nm{font-size:21px;font-weight:800}
.sum{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding:2px 2px 4px}
.sum::-webkit-scrollbar{display:none}
.sp2{flex:none;display:flex;align-items:center;gap:10px;border-radius:999px;padding:7px 20px 7px 8px;color:#fff;text-align:left}
.sp2 .si{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sp2 .stx{display:flex;flex-direction:column}
.sp2 .st{font-size:18px;font-weight:800;line-height:1.1;white-space:nowrap}
.sp2 .ss{font-size:16px;color:var(--mute);font-weight:600;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.sp2.alert .ss{color:#ff9a9e}
.wg{grid-template-columns:162px 162px 1fr;grid-auto-rows:162px}
#roast{text-wrap:balance}
html{word-break:keep-all}

tTimer:'다음 타이머',dueSoon:`곧 마감${H('磨勘')}`,nothingDue:`마감${H('磨勘')} 없음 🎉`,latestNote:`최근${H('最近')} 쪽지${H('-紙')}`,noNotes:`아직 쪽지${H('-紙')} 없음`,tapAddPhotos:`탭해서 사진${H('寫眞')} 추가${H('追加')}`,newB:'새',from:'보낸 사람'}
};
let S={user:localStorage.getItem('cave_user')||'arik',lang:localStorage.getItem('cave_lang')||'en',tab:'home',filter:'all',chores:[],timers:[],photos:[],roasts:[],notes:[]};
const wrapH=r=>typeof r==='string'&&r.includes('class="hj"')?`<span>${r}</span>`:r;

const $=s=>document.querySelector(s);

const iconFor=s=>{for(const[re,e]of ICONS)if(re.test(s))return e;return'✨'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const weekendDate=()=>{const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7));return ymd(d)};

function dueInfo(d){
  if(!d)return{cls:'',txt:'',grp:'none'};
  const td=ymd(new Date());
  if(d<td)return{cls:'over',txt:t('overdue')+' · '+fmtDate(d),grp:'over'};
  if(d===td)return{cls:'today',txt:t('today'),grp:'today'};
  if(d===addDays(1))return{cls:'',txt:t('tomorrow'),grp:'up'};
  return{cls:'',txt:fmtDate(d),grp:'up'};
}
function fmtDate(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(t('locale'),{weekday:'short',month:'short',day:'numeric'})}
function ago(ts){
  const s=(Date.now()-new Date(ts))/1000,rtf=new Intl.RelativeTimeFormat(t('locale'),{numeric:'auto'});
  if(s<60)return rtf.format(0,'second');if(s<3600)return rtf.format(-Math.floor(s/60),'minute');
  if(s<86400)return rtf.format(-Math.floor(s/3600),'hour');return rtf.format(-Math.floor(s/86400),'day');
}

const photoUrl=p=>sb.storage.from('photos').getPublicUrl(p.path).data.publicUrl;

/* ---------- data ---------- */
const Q={
  chores:()=>sb.from('chores').select('*').order('created_at'),
  timers:()=>sb.from('timers').select('*').eq('dismissed',false).order('ends_at'),
  photos:()=>sb.from('photos').select('*').order('created_at',{ascending:false}),
  roasts:()=>sb.from('roasts').select('*').order('created_at'),
  notes:()=>sb.from('notes').select('*').order('created_at',{ascending:false}).limit(60)
};
async function load(tb){
  const {data,error}=await Q[tb]();
  if(error){toast(t('loadErr')+error.message);return}
  if(tb==='notes'&&notesSeen){
    const fresh=data.filter(n=>!notesSeen.has(n.id)&&!n.read&&forMe(n));
    if(fresh.length){toast(t('newNoteFrom',t(fresh[0].from_user)));chime()}
  }
  S[tb]=data;
  if(tb==='notes'){notesSeen=new Set(data.map(n=>n.id));if(S.tab==='notes')markRead()}
  if(tb==='chores')await resetRepeats();
  if(tb==='photos'&&!wallSet)setWall();
  renderAll();
}
async function resetRepeats(){
  const now=new Date(),day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const wk=new Date(day);wk.setDate(day.getDate()-((day.getDay()+6)%7));
  const stale=S.chores.filter(c=>c.done&&c.repeat!=='none'&&c.done_at&&new Date(c.done_at)<(c.repeat==='daily'?day:wk));
  if(!stale.length)return;
  await sb.from('chores').update({done:false,done_at:null}).in('id',stale.map(c=>c.id));
  stale.forEach(c=>{c.done=false;c.done_at=null});
}
async function markRead(){
  const ids=unreadNotes().map(n=>n.id);if(!ids.length)return;
  S.notes.forEach(n=>{if(ids.includes(n.id))n.read=true});
  await sb.from('notes').update({read:true}).in('id',ids);
  renderBadges();renderWidgets();
}
function subscribe(){
  const ch=sb.channel('cave');
  Object.keys(Q).forEach(tb=>ch.on('postgres_changes',{event:'*',schema:'public',table:tb},()=>load(tb)));
  ch.subscribe();
}

}

}

/* ---------- photos ---------- */
function compress(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1800,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(url);res(b||file)},'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
$('#upl').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';let ok=0;
  for(let i=0;i<files.length;i++){

    const blob=await compress(files[i]);
    const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error){toast(t('upFail')+up.error.message);continue}
    const ins=await sb.from('photos').insert({path,uploaded_by:S.user});
    if(ins.error){toast(ins.error.message);continue}

  }
  if(ok)toast(t('added',ok));

  const due=S.timers.find(x=>new Date(x.ends_at)<=Date.now());
  if(due&&alarmId!==due.id){
    alarmId=due.id;$('#alarmLbl').textContent=due.label;$('#alarm').classList.add('on');
    if(showOn)stopShow();beep();clearInterval(alarmBeep);alarmBeep=setInterval(beep,900);
  }
  if(!due&&alarmId){alarmId=null;$('#alarm').classList.remove('on');clearInterval(alarmBeep)}
}
$('#alarmOk').onclick=async()=>{
  const id=alarmId;alarmId=null;$('#alarm').classList.remove('on');clearInterval(alarmBeep);
  S.timers=S.timers.filter(x=>x.id!==id);renderAll();
  if(id)await sb.from('timers').update({dismissed:true}).eq('id',id);
};

/* ---------- roast editor ---------- */
$('#gear').onclick=()=>{renderRoasts();$('#sheet').classList.add('on')};
$('#sheetClose').onclick=()=>$('#sheet').classList.remove('on');
$('#rAdd').onclick=async()=>{
  const text=$('#rText').value.trim(),ko=$('#rTextKo').value.trim();
  if(!text&&!ko)return;
  const {error}=await sb.from('roasts').insert({text:text||ko,text_ko:ko||null,target:segVal('rTarget')});
  if(error)return toast(error.message);
  $('#rText').value='';$('#rTextKo').value='';load('roasts');
};
$('#rList').onclick=async e=>{
  if(e.target.dataset.act!=='rdel')return;
  const id=e.target.closest('.rl').dataset.id;
  S.roasts=S.roasts.filter(r=>r.id!==id);renderRoasts();
  await sb.from('roasts').delete().eq('id',id);
};

/* ---------- clock, idle, wake lock ---------- */
let lastMin=-1;
function tick(){
  const d=new Date(),loc=t('locale');
  const time=d.toLocaleTimeString(loc,{hour:'numeric',minute:'2-digit'});
  $('#sideTime').textContent=time+' · '+d.toLocaleDateString(loc,{month:'numeric',day:'numeric'});
  $('#showClock').textContent=time;
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();renderWidgets()}
  updAnalog(d);
  document.querySelectorAll('[data-end]').forEach(el=>el.textContent=fmt(new Date(el.dataset.end)-Date.now()));
  document.querySelectorAll('.prog').forEach(el=>el.style.width=pct({created_at:el.dataset.start,ends_at:el.dataset.endp})+'%');
  checkAlarm();
  const busy=['lb','sheet','add'].some(id=>$('#'+id).classList.contains('on'))||/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!showOn&&!alarmId&&S.photos.length&&Date.now()-last>180000&&!busy)startShow();
}
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{last=Date.now()},true));
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();Object.keys(Q).forEach(load)}});
document.addEventListener('pointerdown',wake,{once:true});

/* ---------- boot ---------- */
applyLang();
(async()=>{
  await Promise.all(Object.keys(Q).map(load));
  rotateRoast();setInterval(rotateRoast,25000);
  setInterval(tick,1000);tick();wake();subscribe();
  setInterval(()=>['chores','timers','photos','notes'].forEach(load),120000);
  setInterval(setWall,600000);
})();
</script>
</body>
